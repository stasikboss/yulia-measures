<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16273B">
<meta name="mobile-web-app-capable" content="yes">
<title>עולם המידות של יוליה</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Fredoka:wght@400;500;600&family=Varela+Round&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: a graph-paper workbench (mm grid). Each station is an instrument card in its own color:
   mass = apple red, volume = water blue, length = ruler gold, time = clock violet. Dark theme = blueprint. */
:root {
  --paper: #F3F7FA;
  --grid: rgba(38, 104, 150, .07);
  --grid-major: rgba(38, 104, 150, .13);
  --card: #FFFFFF;
  --card-2: #EEF4F8;
  --ink: #16273B;
  --muted: #536579;
  --line: #D3E0EA;
  --shadow: 0 1px 0 rgba(22, 39, 59, .06), 0 6px 18px -8px rgba(22, 39, 59, .22);

  --mass: #D6443A; --mass-ink: #B5352C; --mass-soft: #FCE7E4;
  --vol: #1683CC;  --vol-ink: #0F6AA8;  --vol-soft: #DFF0FB;
  --len: #D79A12;  --len-ink: #8F6400;  --len-soft: #FBF1D4;
  --time: #6450C8; --time-ink: #5442B3; --time-soft: #ECE8FA;

  --good: #1C9150; --good-soft: #DDF4E6;
  --bad: #C9413A;  --bad-soft: #FBE4E2;
  --star: #F0AE00;

  --apple: #E4473D; --apple-dk: #A92E27; --leaf: #49A84C; --stem: #6E4426;
  --sugar: #FFFFFF; --sugar-band: #2F7FD0;
  --kraft: #D8AE76; --kraft-dk: #A9824E;
  --wood: #F3C54F; --wood-dk: #CF9A1B;
  --metal: #CBD5DE; --metal-dk: #8494A4;
  --glass: rgba(150, 196, 228, .20); --glass-line: #6E98B8;
  --water: #3BA3E6; --water-dk: #1E7DBE; --water-hi: #9CD5F7;
  --lcd: #C7E5AE; --lcd-ink: #1E2E17;
  --outline: #22324A;
  --road: #59636E; --grass: #8FCB6B;

  --font-display: "Fredoka", "Varela Round", "Arial Hebrew", Arial, sans-serif;
  --font-body: "Assistant", "Arial Hebrew", "Noto Sans Hebrew", Arial, sans-serif;
  --font-lcd: "Share Tech Mono", "Courier New", monospace;

  --r-lg: 22px; --r-md: 14px; --r-sm: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0C1F32; --grid: rgba(140, 200, 255, .06); --grid-major: rgba(140, 200, 255, .12);
    --card: #12304A; --card-2: #17395A; --ink: #E7F0F8; --muted: #A2B7CB; --line: #29496A;
    --shadow: 0 1px 0 rgba(0, 0, 0, .25), 0 8px 22px -10px rgba(0, 0, 0, .6);
    --mass: #FF766A; --mass-ink: #FF9A90; --mass-soft: #3A2632;
    --vol: #4DB7F7;  --vol-ink: #86CEFA;  --vol-soft: #133A5C;
    --len: #F2BF45;  --len-ink: #F6CF6E;  --len-soft: #3A3322;
    --time: #A391F6; --time-ink: #BDB0FA; --time-soft: #2A2A52;
    --good: #48CB7F; --good-soft: #163F2F; --bad: #FF7B71; --bad-soft: #432329; --star: #FFC933;
    --glass: rgba(200, 230, 255, .10); --glass-line: #9CC6E6; --outline: #0A1828;
    --lcd: #B7DA9C; --road: #4A5662; --grass: #5E9E48;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0C1F32; --grid: rgba(140, 200, 255, .06); --grid-major: rgba(140, 200, 255, .12);
  --card: #12304A; --card-2: #17395A; --ink: #E7F0F8; --muted: #A2B7CB; --line: #29496A;
  --shadow: 0 1px 0 rgba(0, 0, 0, .25), 0 8px 22px -10px rgba(0, 0, 0, .6);
  --mass: #FF766A; --mass-ink: #FF9A90; --mass-soft: #3A2632;
  --vol: #4DB7F7;  --vol-ink: #86CEFA;  --vol-soft: #133A5C;
  --len: #F2BF45;  --len-ink: #F6CF6E;  --len-soft: #3A3322;
  --time: #A391F6; --time-ink: #BDB0FA; --time-soft: #2A2A52;
  --good: #48CB7F; --good-soft: #163F2F; --bad: #FF7B71; --bad-soft: #432329; --star: #FFC933;
  --glass: rgba(200, 230, 255, .10); --glass-line: #9CC6E6; --outline: #0A1828;
  --lcd: #B7DA9C; --road: #4A5662; --grass: #5E9E48;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid-major) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 60px 60px, 60px 60px, 6px 6px, 6px 6px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--vol); outline-offset: 2px; border-radius: 8px; }
.m { direction: ltr; unicode-bidi: isolate; display: inline-block; white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.st-mass { --c: var(--mass); --ci: var(--mass-ink); --cs: var(--mass-soft); }
.st-vol  { --c: var(--vol);  --ci: var(--vol-ink);  --cs: var(--vol-soft); }
.st-len  { --c: var(--len);  --ci: var(--len-ink);  --cs: var(--len-soft); }
.st-time { --c: var(--time); --ci: var(--time-ink); --cs: var(--time-soft); }

/* ---------- shell ---------- */
.app { max-width: 1000px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 10px;
  padding-block: 10px; margin-inline: -16px; padding-inline: 16px;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; background: none; border: 0; padding: 0; text-align: start; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand b { font-family: var(--font-display); font-weight: 600; font-size: 1.12rem; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px 5px 10px; border-radius: 99px;
  background: var(--card); border: 1px solid var(--line); font-weight: 700; font-variant-numeric: tabular-nums;
}
.pill svg { width: 20px; height: 20px; }
.icon-btn {
  width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
  background: var(--card); border: 1px solid var(--line); flex: none;
}
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn[aria-pressed="false"] { opacity: .55; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 8px 20px; border-radius: 14px; border: 2px solid transparent;
  font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; line-height: 1.15;
  background: var(--ink); color: var(--paper);
  transition: transform .12s ease, box-shadow .12s ease, background .2s;
  box-shadow: 0 3px 0 rgba(0, 0, 0, .18);
  touch-action: manipulation; user-select: none;
}
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, .18); }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
.btn svg { width: 22px; height: 22px; flex: none; }
.btn.c { background: var(--c); color: #fff; }
.st-len .btn.c { color: #2B2100; }
.btn.soft { background: var(--cs); color: var(--ci); box-shadow: none; border-color: transparent; }
.btn.ghost { background: var(--card); color: var(--ink); border-color: var(--line); box-shadow: none; }
.btn.small { min-height: 40px; padding: 6px 14px; font-size: .95rem; border-radius: 12px; }
.btn.hint { background: var(--card); color: var(--ink); border-color: var(--star); box-shadow: none; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* ---------- home ---------- */
.hero { padding-block: 22px 14px; display: grid; gap: 6px; }
.hero h1 {
  font-family: var(--font-display); font-weight: 600; margin: 0;
  font-size: clamp(2rem, 7vw, 3.3rem); line-height: 1.05; text-wrap: balance; letter-spacing: -.01em;
}
.hero h1 .tape {
  background: linear-gradient(transparent 62%, color-mix(in srgb, var(--len) 45%, transparent) 62%);
  padding-inline: 4px;
}
.hero p { margin: 0; color: var(--muted); max-width: 60ch; }
.facts {
  display: flex; gap: 8px; overflow-x: auto; padding-block: 6px 4px; margin-inline: -16px; padding-inline: 16px;
  scrollbar-width: none;
}
.facts::-webkit-scrollbar { display: none; }
.fact {
  flex: none; padding: 6px 12px; border-radius: 10px; font-weight: 700; font-size: .92rem;
  background: var(--cs); color: var(--ci); border: 1px dashed var(--c);
}
.stations { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 10px; }
.st-card {
  position: relative; display: grid; gap: 6px; align-content: start; text-align: start;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 14px; box-shadow: var(--shadow); min-width: 0;
  transition: transform .15s ease;
}
.st-card:hover { transform: translateY(-2px); }
.st-card:active { transform: translateY(1px); }
.st-card .art {
  height: 112px; border-radius: 16px; background: var(--cs); display: grid; place-items: center; overflow: hidden;
}
.st-card .art svg { height: 100px; width: auto; max-width: 100%; }
.st-card h2 { margin: 4px 0 0; font-family: var(--font-display); font-weight: 600; font-size: 1.25rem; line-height: 1.15; color: var(--ci); }
.st-card .sub { color: var(--muted); font-size: .88rem; line-height: 1.3; }
.meter { height: 10px; border-radius: 99px; background: var(--card-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--c); border-radius: 99px; transition: width .6s ease; }
.st-meta { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: .85rem; color: var(--muted); font-weight: 700; }
.st-meta .stars { display: inline-flex; align-items: center; gap: 3px; color: var(--ink); }
.st-meta svg { width: 16px; height: 16px; }
.badges { position: absolute; top: 20px; inset-inline-start: 20px; display: flex; gap: 4px; }
.badges svg { width: 30px; height: 30px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.2)); }
.home-note { margin-top: 18px; font-size: .9rem; color: var(--muted); }

/* ---------- station ---------- */
.st-head { display: flex; align-items: center; gap: 12px; padding-block: 16px 8px; }
.st-head .art { width: 64px; height: 64px; flex: none; border-radius: 16px; background: var(--cs); display: grid; place-items: center; }
.st-head .art svg { width: 54px; height: 54px; }
.st-head h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: clamp(1.5rem, 5vw, 2.1rem); line-height: 1.1; color: var(--ci); }
.st-head p { margin: 2px 0 0; color: var(--muted); font-size: .92rem; }
.seg {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 16px;
  background: var(--card); border: 1px solid var(--line); margin-block: 8px 14px;
}
.seg button {
  border: 0; background: transparent; border-radius: 12px; min-height: 46px; padding: 4px 6px;
  font-family: var(--font-display); font-weight: 600; font-size: 1rem; color: var(--muted);
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.seg button svg { width: 20px; height: 20px; }
.seg button[aria-selected="true"] { background: var(--c); color: #fff; }
.st-len .seg button[aria-selected="true"] { color: #2B2100; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.chip {
  border: 1.5px solid var(--line); background: var(--card); border-radius: 99px; padding: 7px 14px;
  font-weight: 700; font-size: .95rem; min-height: 40px;
}
.chip[aria-pressed="true"] { border-color: var(--c); background: var(--cs); color: var(--ci); }
.panel {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow);
  padding: 16px; display: grid; gap: 14px; min-width: 0;
}
.panel h3 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.2rem; }
.panel .lead { margin: 0; color: var(--muted); }
.stage { position: relative; border-radius: 18px; background: var(--cs); overflow: hidden; }
.stage svg { display: block; width: 100%; height: auto; }
.learn-grid { display: grid; gap: 14px; }
@media (min-width: 820px) {
  .learn-grid.two { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
}
.readouts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.ro {
  border-radius: 14px; background: var(--card-2); padding: 8px 12px; display: grid; gap: 0; min-width: 0;
  border: 1.5px solid transparent; transition: border-color .3s, background .3s;
}
.ro small { color: var(--muted); font-weight: 700; font-size: .8rem; }
.ro b { font-family: var(--font-display); font-weight: 600; font-size: 1.45rem; line-height: 1.2; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.ro.on { border-color: var(--c); background: var(--cs); }
.equation {
  font-weight: 700; font-size: 1.05rem; background: var(--card-2); border-radius: 12px; padding: 10px 12px;
  display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; min-height: 48px;
}
.equation .m { font-family: var(--font-display); font-weight: 500; font-size: 1.12rem; white-space: normal; }
.note { font-size: .85rem; color: var(--muted); margin: 0; }
.tools { display: flex; flex-wrap: wrap; gap: 10px; }
.item-btn {
  display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 10px; text-align: start;
  padding: 8px 12px; border-radius: 16px; border: 2px solid var(--line); background: var(--card);
  min-height: 64px; flex: 1 1 200px; min-width: 0; touch-action: manipulation;
}
.item-btn svg.ic { width: 44px; height: 44px; }
.item-btn b { display: block; font-family: var(--font-display); font-weight: 600; font-size: 1.02rem; line-height: 1.2; }
.item-btn span { font-size: .85rem; color: var(--muted); }
.item-btn:active { border-color: var(--c); background: var(--cs); }
.item-btn .pm { display: flex; gap: 6px; grid-column: 1 / -1; }
.item-btn.done { border-color: var(--c); }
.stepper { display: flex; gap: 6px; }
.stepper .btn { flex: 1; }
.slider { width: 100%; accent-color: var(--c); height: 34px; direction: ltr; }

/* milestone banner */
.banner {
  position: absolute; inset-inline: 12px; top: 12px; z-index: 3; pointer-events: none;
  background: var(--card); border: 2px solid var(--c); color: var(--ink); border-radius: 16px;
  padding: 8px 14px; text-align: center; font-family: var(--font-display); font-weight: 600; font-size: 1.25rem;
  box-shadow: var(--shadow); opacity: 0; transform: translateY(-14px) scale(.96);
  transition: opacity .3s ease, transform .35s cubic-bezier(.3, 1.5, .5, 1);
}
.banner.show { opacity: 1; transform: none; }
.banner small { display: block; font-family: var(--font-body); font-weight: 600; font-size: .85rem; color: var(--muted); }

/* svg helpers */
.f-apple { fill: var(--apple); } .f-apple-dk { fill: var(--apple-dk); } .f-leaf { fill: var(--leaf); } .f-stem { fill: var(--stem); }
.f-sugar { fill: var(--sugar); } .f-band { fill: var(--sugar-band); } .f-kraft { fill: var(--kraft); } .f-kraft-dk { fill: var(--kraft-dk); }
.f-wood { fill: var(--wood); } .f-wood-dk { fill: var(--wood-dk); } .f-metal { fill: var(--metal); } .f-metal-dk { fill: var(--metal-dk); }
.f-glass { fill: var(--glass); } .f-water { fill: var(--water); } .f-water-dk { fill: var(--water-dk); } .f-water-hi { fill: var(--water-hi); }
.f-lcd { fill: var(--lcd); } .f-lcd-ink { fill: var(--lcd-ink); } .f-card { fill: var(--card); } .f-card2 { fill: var(--card-2); }
.f-ink { fill: var(--ink); } .f-muted { fill: var(--muted); } .f-c { fill: var(--c); } .f-cs { fill: var(--cs); } .f-star { fill: var(--star); }
.f-road { fill: var(--road); } .f-grass { fill: var(--grass); } .f-line { fill: var(--line); } .f-good { fill: var(--good); }
.f-mass { fill: var(--mass); } .f-vol { fill: var(--vol); } .f-len { fill: var(--len); } .f-time { fill: var(--time); }
.s-out { stroke: var(--outline); } .s-ink { stroke: var(--ink); } .s-muted { stroke: var(--muted); } .s-c { stroke: var(--c); }
.s-glass { stroke: var(--glass-line); } .s-line { stroke: var(--line); } .s-card { stroke: var(--card); } .s-water { stroke: var(--water); }
.t-ink { fill: var(--ink); } .t-muted { fill: var(--muted); } .t-c { fill: var(--ci); }
svg text { font-family: var(--font-body); font-weight: 700; }
svg .disp { font-family: var(--font-display); font-weight: 600; }
svg .lcd { font-family: var(--font-lcd); }

/* item drop / pour animations */
@keyframes drop { 0% { transform: translateY(-90px); opacity: 0; } 60% { transform: translateY(4px); opacity: 1; } 80% { transform: translateY(-3px); } 100% { transform: none; } }
.drop > g { animation: drop .5s cubic-bezier(.3, 1.2, .5, 1) both; }
.drop { cursor: pointer; }
@keyframes wave { from { transform: translateX(0); } to { transform: translateX(-60px); } }
.wave { animation: wave 2.4s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -24; } }
.stream { stroke-dasharray: 8 4; animation: flow .35s linear infinite; }
@keyframes gallop { 0%, 100% { transform: rotate(12deg); } 50% { transform: rotate(-12deg); } }
.horse .leg { transform-box: fill-box; transform-origin: 50% 0; }
.horse.run .leg.a { animation: gallop .32s ease-in-out infinite; }
.horse.run .leg.b { animation: gallop .32s ease-in-out infinite reverse; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
.horse.run .body { animation: bob .32s ease-in-out infinite; }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); } }
.pop { animation: pop .4s cubic-bezier(.3, 1.4, .5, 1) both; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 55%, transparent); } 100% { box-shadow: 0 0 0 14px transparent; } }
.pulse { animation: pulse .8s ease-out; }

/* ---------- quiz ---------- */
.qnav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.qdot {
  width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--line); background: var(--card);
  font-weight: 800; font-variant-numeric: tabular-nums; position: relative; display: grid; place-items: center; font-size: .95rem;
}
.qdot.done { background: var(--cs); border-color: var(--c); color: var(--ci); }
.qdot.cur { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink) inset; }
.qdot .mini { position: absolute; bottom: -7px; inset-inline: 0; display: flex; justify-content: center; gap: 0; }
.qdot .mini svg { width: 11px; height: 11px; }
.qcard { display: grid; gap: 16px; }
.qtop { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); font-weight: 700; font-size: .9rem; }
.qtag { padding: 3px 10px; border-radius: 99px; background: var(--cs); color: var(--ci); }
.qtext { font-family: var(--font-display); font-weight: 500; font-size: clamp(1.25rem, 4.2vw, 1.6rem); line-height: 1.35; margin: 0; text-wrap: pretty; }
.qtext b { font-weight: 600; color: var(--ci); }
.answer-num { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.answer-num input {
  width: 9.5em; max-width: 100%; min-height: 56px; border-radius: 14px; border: 2px solid var(--line); background: var(--card-2);
  font-family: var(--font-display); font-weight: 600; font-size: 1.6rem; text-align: center; padding: 4px 10px; direction: ltr;
}
.answer-num input:focus { border-color: var(--c); outline: none; }
.answer-num .unit { font-family: var(--font-display); font-weight: 600; font-size: 1.3rem; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opt {
  min-height: 58px; border-radius: 14px; border: 2px solid var(--line); background: var(--card);
  font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; padding: 8px 10px; line-height: 1.25;
}
.opt[aria-pressed="true"] { border-color: var(--c); background: var(--cs); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.cmp { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; direction: ltr; }
.cmp .qty {
  min-height: 72px; border-radius: 16px; background: var(--card-2); display: grid; place-items: center; text-align: center;
  font-family: var(--font-display); font-weight: 600; font-size: 1.35rem; padding: 6px; direction: rtl;
}
.cmp .sym {
  width: 64px; height: 64px; border-radius: 50%; border: 3px dashed var(--c); display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 600; font-size: 2.1rem; color: var(--ci); background: var(--card);
}
.cmp-btns { display: flex; justify-content: center; gap: 12px; direction: ltr; }
.cmp-btns .opt { width: 76px; font-size: 1.9rem; }
.build { display: grid; gap: 12px; }
.tray {
  min-height: 120px; border-radius: 18px; border: 3px dashed var(--c); background: var(--cs);
  display: flex; flex-wrap: wrap; align-content: flex-end; gap: 6px; padding: 10px; position: relative;
}
.tray.over { background: color-mix(in srgb, var(--c) 22%, var(--card)); }
.tray .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ci); font-weight: 700; padding: 10px; text-align: center; pointer-events: none; }
.tray .tk { border: 0; background: transparent; padding: 0; animation: pop .35s both; }
.tray .tk svg { width: 46px; height: 46px; display: block; }
.palette { display: flex; flex-wrap: wrap; gap: 10px; }
.tok {
  touch-action: none; user-select: none; display: grid; justify-items: center; gap: 2px; min-width: 92px;
  padding: 8px 10px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); font-weight: 700; font-size: .85rem;
}
.tok svg { width: 52px; height: 52px; pointer-events: none; }
.tok span { pointer-events: none; }
.ghost-drag { position: fixed; z-index: 60; pointer-events: none; width: 64px; height: 64px; transform: translate(-50%, -60%) scale(1.15); filter: drop-shadow(0 6px 8px rgba(0,0,0,.3)); }
.total-line { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; }
.qactions { display: flex; flex-wrap: wrap; gap: 10px; }
.qactions .grow { flex: 1 1 160px; }
.feedback { border-radius: 16px; padding: 12px 14px; display: grid; gap: 6px; }
.feedback.ok { background: var(--good-soft); border: 2px solid var(--good); }
.feedback.no { background: var(--bad-soft); border: 2px solid var(--bad); }
.feedback.info { background: var(--card-2); border: 2px solid var(--line); }
.feedback h4 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.25rem; display: flex; align-items: center; gap: 8px; }
.feedback h4 svg { width: 26px; height: 26px; }
.feedback p { margin: 0; }
.earned { display: inline-flex; gap: 2px; }
.earned svg { width: 26px; height: 26px; }
.hintbox { border-radius: 18px; border: 2px solid var(--star); background: var(--card); padding: 12px; display: grid; gap: 10px; }
.hintbox h4 { margin: 0; font-family: var(--font-display); font-weight: 600; display: flex; gap: 8px; align-items: center; font-size: 1.1rem; }
.hintbox h4 svg { width: 24px; height: 24px; }
.hintbox .viz { overflow-x: auto; border-radius: 14px; background: var(--cs); padding: 6px; }
.hintbox .viz > svg { display: block; min-width: 300px; width: 100%; height: auto; }
.hintbox p { margin: 0; }
.steps { margin: 0; padding-inline-start: 1.2em; display: grid; gap: 4px; }
.complete {
  text-align: center; display: grid; gap: 10px; justify-items: center; padding-block: 10px;
}
.complete svg.medal { width: 96px; height: 96px; }
.complete h3 { font-size: 1.5rem; }

/* ---------- overlays ---------- */
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 70; width: 100%; height: 100%; }
.toast {
  position: fixed; inset-inline: 16px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 80; margin-inline: auto; max-width: 520px;
  background: var(--ink); color: var(--paper); border-radius: 16px; padding: 12px 16px; text-align: center;
  font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; box-shadow: var(--shadow);
  opacity: 0; transform: translateY(20px); transition: opacity .25s, transform .3s cubic-bezier(.3, 1.4, .5, 1); pointer-events: none;
}
.toast.show { opacity: 1; transform: none; }
.modal-back { position: fixed; inset: 0; z-index: 90; background: rgba(8, 18, 30, .55); display: grid; place-items: center; padding: 16px; }
.modal { width: min(520px, 100%); max-height: 90vh; overflow: auto; background: var(--card); border-radius: 22px; padding: 18px; display: grid; gap: 14px; box-shadow: var(--shadow); }
.modal h2 { margin: 0; font-family: var(--font-display); font-weight: 600; }
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding-block: 6px; border-bottom: 1px solid var(--line); }
.set-row:last-of-type { border-bottom: 0; }
.set-row .seg2 { display: flex; gap: 6px; }
.howto { margin: 0; padding-inline-start: 1.2em; color: var(--muted); font-size: .92rem; display: grid; gap: 4px; }

@media (max-width: 420px) {
  body { font-size: 16px; }
  .pill .pts { display: none; }
  .stations { gap: 10px; }
  .st-card { padding: 10px; }
  .st-card .art { height: 92px; }
  .st-card .art svg { height: 82px; }
  .st-card h2 { font-size: 1.08rem; }
  .st-card .sub { display: none; }
  .seg button { font-size: .92rem; }
  .seg button svg { display: none; }
  .opts { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* ---------- station pieces ---------- */
.stage svg, .hintbox svg, .hb svg { direction: ltr; }
#lenSvg { touch-action: pan-y; cursor: ew-resize; }
.boxes { display: flex; flex-wrap: wrap; gap: 12px; }
.box { display: grid; gap: 4px; justify-items: center; }
.box small { font-weight: 700; color: var(--muted); font-size: .8rem; }
.cells { display: grid; grid-template-columns: repeat(5, 16px); gap: 3px; padding: 6px; border: 2px solid var(--line); border-radius: 10px; background: var(--card); direction: ltr; }
.box.full .cells { border-color: var(--c); }
.cell { width: 16px; height: 16px; border-radius: 4px; background: var(--card-2); display: block; transition: background .3s; }
.cell.on { background: var(--c); }
.shelf-jug { display: inline-grid; justify-items: center; gap: 0; }
.shelf-jug svg { width: 46px; height: 46px; }
.shelf-jug small { font-weight: 700; font-size: .78rem; color: var(--ci); }
#shelf:empty { display: none; }
.bottles { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.bottle-btn { display: grid; justify-items: center; gap: 4px; padding: 8px 12px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); flex: 1 1 80px; }
.bottle-btn svg { width: auto; }
.bottle-btn b { font-family: var(--font-display); font-weight: 600; }
.bottle-btn[aria-pressed="true"] { border-color: var(--c); background: var(--cs); }
.bottle-out { display: grid; gap: 10px; }
.cups-row { display: flex; flex-wrap: wrap; gap: 6px; }
.cupi { display: grid; justify-items: center; animation: pop .35s cubic-bezier(.3, 1.4, .5, 1) both; }
.cupi svg { width: 40px; height: 40px; }
.cupi small { font-size: .75rem; font-weight: 700; color: var(--ci); }
.zoom { background: var(--card-2); border-radius: 14px; padding: 10px 12px; display: grid; gap: 6px; }
.zoom-t { font-weight: 700; font-size: .9rem; color: var(--muted); }
.zoom-cells { display: grid; grid-template-columns: repeat(10, 1fr); gap: 0; height: 40px; border: 3px solid var(--outline); border-radius: 6px; overflow: hidden; direction: ltr; background: var(--wood); }
.zoom-cells i { border-inline-end: 2px solid var(--outline); transition: background .2s; }
.zoom-cells i:last-child { border-inline-end: 0; }
.zoom-cells i.on { background: var(--c); }
.st-len .zoom-cells i.on { background: var(--vol); }
.zoom-l { display: flex; justify-content: space-between; font-size: .85rem; font-weight: 700; direction: ltr; }
.zoom-l span { color: var(--muted); }
.digital { font-family: var(--font-lcd); font-size: 2.2rem; background: var(--lcd); color: var(--lcd-ink); border-radius: 12px; padding: 4px 14px; direction: ltr; text-align: center; letter-spacing: .04em; border: 3px solid var(--outline); }
.strip { display: grid; gap: 4px; }
.cells24 { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; direction: ltr; }
.cells24 i { height: 22px; border-radius: 4px; display: block; }
.lbl24 { display: flex; justify-content: space-between; direction: ltr; font-size: .78rem; font-weight: 700; color: var(--muted); }
.cal { display: grid; gap: 6px; }
.cal-h, .cal-g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-h span { text-align: center; font-weight: 800; color: var(--ci); }
.cal-g i {
  aspect-ratio: 1; border-radius: 10px; background: var(--card); border: 2px solid var(--line); display: grid; place-items: center;
  font-style: normal; font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; max-width: 100%;
}
.cal-g i.on { background: var(--c); border-color: var(--c); color: #fff; }
.cal-g i.end { box-shadow: 0 0 0 3px var(--star) inset; }
.cal-g i.pop { animation: pop .4s cubic-bezier(.3, 1.4, .5, 1) both; }
.pageday { border-radius: 16px; border: 2px solid var(--c); background: var(--card); padding: 10px; text-align: center; display: grid; }
.pageday small { color: var(--muted); font-weight: 700; }
.pageday b { font-family: var(--font-display); font-weight: 600; font-size: 1.8rem; color: var(--ci); }

/* ---------- hint visuals ---------- */
.hblocks { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; padding: 6px; }
.hb { display: grid; justify-items: center; gap: 2px; min-width: 0; }
.hb > svg { width: 64px; height: 64px; }
.hb.small > svg { width: 42px; height: 42px; }
.hb small { font-size: .78rem; font-weight: 700; color: var(--ci); text-align: center; line-height: 1.2; }

.hb.bar svg { height: auto; min-width: 40px; }
.hb.box span { display: grid; place-items: center; min-width: 74px; min-height: 52px; padding: 4px 10px; border-radius: 12px; background: var(--card); border: 2px solid var(--c); font-weight: 800; color: var(--ink); }
.hb.more { align-self: center; font-weight: 800; color: var(--ci); }
.hb-op { align-self: center; font-family: var(--font-display); font-weight: 600; font-size: 2rem; color: var(--ci); padding-inline: 4px; }
.hb.rowcells { flex: 1 1 100%; justify-items: stretch; }
.cells-row { display: grid; gap: 2px; direction: ltr; }
.cells-row.c24 { grid-template-columns: repeat(24, 1fr); }
.cells-row.c7 { grid-template-columns: repeat(7, minmax(0, 34px)); }
.cells-row i { height: 18px; border-radius: 4px; background: var(--card-2); border: 1px solid var(--line); display: block; }

.grid60 { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; direction: ltr; }
.grid60 i { font-style: normal; font-size: .68rem; font-weight: 800; background: var(--card); border: 1.5px solid var(--c); border-radius: 5px; padding: 2px 3px; text-align: center; }
.hb > svg.hclock { width: 130px; height: 130px; }
.laps { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; flex: 1 1 140px; }
.lap { padding: 4px 10px; border-radius: 99px; background: var(--card); border: 1.5px solid var(--c); font-weight: 700; font-size: .85rem; }
.barmodel { display: grid; gap: 4px; padding: 6px; }
.bm-total { border: 2px solid var(--ink); border-bottom: 0; height: 26px; border-radius: 8px 8px 0 0; display: grid; place-items: center; font-weight: 800; font-size: .9rem; }
.bm-total span { background: var(--cs); padding-inline: 8px; transform: translateY(-12px); }
.bm-row { display: flex; gap: 0; border: 2px solid var(--ink); border-radius: 8px; overflow: hidden; min-height: 48px; }
.bm-part { background: var(--c); color: #fff; display: grid; place-items: center; text-align: center; padding: 4px; font-weight: 800; font-size: .85rem; border-inline-start: 2px solid var(--ink); min-width: 34px; }
.bm-part:first-child { border-inline-start: 0; }
.st-len .bm-part { color: #2B2100; }
.bm-part.q { background: var(--card); color: var(--ink); background-image: repeating-linear-gradient(45deg, transparent 0 6px, var(--cs) 6px 12px); }
.tline { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; direction: ltr; padding: 6px; }
.tp { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; padding: 6px 10px; border-radius: 12px; background: var(--card); border: 2px solid var(--c); }
.tp.q { border-style: dashed; color: var(--ci); }
.tj { display: grid; justify-items: center; min-width: 54px; }
.tj small { font-size: .75rem; font-weight: 800; color: var(--ci); direction: rtl; white-space: nowrap; }
.tj i { display: block; width: 100%; height: 3px; background: var(--c); position: relative; border-radius: 2px; }
.tj i::after { content: ''; position: absolute; right: -2px; top: -5px; border: 6.5px solid transparent; border-left-color: var(--c); border-right: 0; }

</style>

/* numbers: decimal comma by default (2,5); thousands grouped with a narrow no-break space (1 000) so a comma is never ambiguous.
   With the decimal point option: 2.5 and 1,000 (Israeli textbook style). */
function fmt(n) {
  let v = Math.round(n * 1e6) / 1e6;
  const neg = v < 0; v = Math.abs(v);
  let [ip, fp] = v.toFixed(6).replace(/0+$/, '').replace(/\.$/, '').split('.');
  const sep = S.dec === ',' ? ' ' : ',';
  ip = ip.replace(/\B(?=(\d{3})+(?!\d))/g, sep);
  return (neg ? '−' : '') + ip + (fp ? S.dec + fp : '');
}
function parseNum(str) {
  if (str == null) return NaN;
  let s = String(str).trim().replace(/[\s  ']/g, '').replace(/[−–]/g, '-');
  if (!s) return NaN;
  if (S.dec === '.') {
    if (/,\d{3}(?!\d)/.test(s) && !/,\d{1,2}$/.test(s)) s = s.replace(/,/g, ''); // 1,000 → 1000
    s = s.replace(',', '.');
  } else {
    s = s.replace(',', '.');
  }
  if (!/^-?\d*\.?\d+$|^-?\d+\.?$/.test(s)) return NaN;
  return parseFloat(s);
}

const Snd = {
  ctx: null,
  ensure() {
    if (!S.sound) return null;
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { return null; }
    return this.ctx;
  },
  tone(f, dur = .15, type = 'sine', vol = .16, delay = 0, slide = 0) {
    const c = this.ensure(); if (!c) return;
    const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + .05);
  },

    const src = c.createBufferSource(), bp = c.createBiquadFilter(), g = c.createGain(), t = c.currentTime;

    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .08); g.gain.setValueAtTime(vol, t + dur - .15); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.buffer = buf; src.connect(bp); bp.connect(g); g.connect(c.destination); src.start(t); src.stop(t + dur);

/* ===== motion helpers ===== */
const easeIO = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
function tween(ms, fn, ease = easeIO) {
  return new Promise(res => {
    if (REDUCED) ms = Math.min(ms, 60);
    const t0 = performance.now();
    const step = (now) => { const t = Math.min(1, (now - t0) / ms); fn(ease(t)); if (t < 1) requestAnimationFrame(step); else res(); };
    requestAnimationFrame(step);
  });
}
const wait = ms => new Promise(r => setTimeout(r, REDUCED ? 0 : ms));

let toastTimer;
function toast(msg) {
  let t = $('.toast');
  if (!t) { t = h2el('<div class="toast" role="status" aria-live="polite"></div>'); document.body.appendChild(t); }
  t.innerHTML = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}
function banner(stage, title, sub = '') {
  let b = $('.banner', stage);
  if (!b) { b = h2el('<div class="banner" aria-live="polite"></div>'); stage.appendChild(b); }
  b.innerHTML = `${title}${sub ? `<small>${sub}</small>` : ''}`;
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
  clearTimeout(b._t); b._t = setTimeout(() => b.classList.remove('show'), 2800);
}

/* confetti */
function confetti(n = 90) {
  if (REDUCED) return;
  let c = $('#confetti');
  if (!c) { c = h2el('<canvas id="confetti"></canvas>'); document.body.appendChild(c); }
  const ctx = c.getContext('2d'), W = c.width = innerWidth * devicePixelRatio, H = c.height = innerHeight * devicePixelRatio;
  const cols = ['#E4473D', '#3BA3E6', '#F3C54F', '#7B66E0', '#49A84C', '#F48FB1'];
  const ps = [...Array(n)].map(() => ({
    x: W * (.2 + Math.random() * .6), y: H * .35, vx: (Math.random() - .5) * 18 * devicePixelRatio, vy: (-Math.random() * 16 - 6) * devicePixelRatio,
    s: (5 + Math.random() * 6) * devicePixelRatio, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[Math.floor(Math.random() * cols.length)]
  }));
  const t0 = performance.now();
  const step = (now) => {
    const el = now - t0; ctx.clearRect(0, 0, W, H);
    ps.forEach(p => { p.vy += .55 * devicePixelRatio; p.x += p.vx; p.y += p.vy; p.vx *= .985; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - el / 1800); ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * .66); ctx.restore(); });
    if (el < 1800) requestAnimationFrame(step); else ctx.clearRect(0, 0, W, H);
  };
  requestAnimationFrame(step);
}

/* pointer drag on an SVG along x (value from svg x-coordinate) */
function svgPoint(svg, evt) {
  const pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
function dragX(svg, onMove) {
  let on = false;
  const mv = (e) => { if (!on) return; e.preventDefault(); onMove(svgPoint(svg, e)); };
  svg.addEventListener('pointerdown', (e) => { on = true; svg.setPointerCapture(e.pointerId); onMove(svgPoint(svg, e)); });
  svg.addEventListener('pointermove', mv);
  const end = () => { on = false; };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
}

  time: { cls: 'st-time', name: 'זמן',        sub: 'שניות · דקות · שעות · ימים · שבועות', disc: ['min', 'h', 'd', 'w'] }

function discover(st, key, title, sub) {
  S.disc[st] = S.disc[st] || {};
  const isNew = !S.disc[st][key];
  if (isNew) { S.disc[st][key] = true; save(); refreshTop(); }
  return isNew;
}
function stationStats(st) {
  const qs = [...(BANK[st].practice || []), ...(BANK[st].challenge || [])];
  const done = qs.filter(q => S.done[q.id]).length;
  const stars = qs.reduce((a, q) => a + (S.stars[q.id] || 0), 0);
  const discN = Object.keys(S.disc[st] || {}).length, discT = STATIONS[st].disc.length;
  const pDone = BANK[st].practice.every(q => S.done[q.id]);
  const cDone = BANK[st].challenge.every(q => S.done[q.id]);
  return { done, total: qs.length, stars, maxStars: qs.length * 3, discN, discT, pDone, cDone,
    pct: Math.round(100 * (done + discN) / (qs.length + discT)) };
}
function totals() {
  let stars = 0, disc = 0;
  ORDER.forEach(st => { const s = stationStats(st); stars += s.stars; disc += s.discN; });
  return { stars, points: stars * 10 + disc * 20 };
}

function addTime(hm, mins) { const [h, m] = hm.split(':').map(Number); const t = h * 60 + m + mins; return `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`; }
function minsBetween(a, b) { const p = s => s.split(':').map(Number); const [h1, m1] = p(a), [h2, m2] = p(b); return (h2 * 60 + m2) - (h1 * 60 + m1); }

const LEARN = {};

/* boxes visual: each box = one big unit made of 10 cells (each = 1/10 of the big unit) */
function boxesHTML(total, perBox, nBoxes, bigLabel, cellLabel) {
  let html = '';
  for (let b = 0; b < nBoxes; b++) {
    const inBox = Math.max(0, Math.min(perBox, total - b * perBox));
    const cells = [...Array(10)].map((_, i) => {
      const f = Math.max(0, Math.min(1, inBox / (perBox / 10) - i));
      return `<i class="cell${f >= 1 ? ' on' : ''}" style="${f > 0 && f < 1 ? `background:linear-gradient(to top, var(--c) ${f * 100}%, var(--card-2) ${f * 100}%)` : ''}"></i>`;
    }).join('');
    html += `<div class="box${inBox >= perBox ? ' full' : ''}"><div class="cells">${cells}</div><small>${bigLabel}</small></div>`;
  }
  return `<div class="boxes">${html}</div><p class="note">כל קופסה = ${bigLabel}. כל משבצת = ${cellLabel}.</p>`;
}

    const parts = L().items.filter(it => counts[it.k]).sort((a, b) => b.v - a.v)
      .map(it => `${fmt(counts[it.k])} × ${fmt(it.v)} ${un(sm)}`);
    $('#eq', root).innerHTML = T === 0
      ? `<span>המשקל ריק. הניחי עליו פריטים.</span>`
      : `${M(`${parts.join(' + ')} = ${fmt(T)} ${un(sm)}`)}<span>=</span>${M(`${fmt(conv(T, sm, bg))} ${un(bg)}`)}`;
    $('#boxes', root).innerHTML = boxesHTML(T, L().mile, Math.ceil(L().max / L().mile), `1 ${un(bg)} = ${fmt(L().mile)} ${un(sm)}`, `${fmt(L().mile / 10)} ${un(sm)}`);
    $('#items', root).querySelectorAll('[data-count]').forEach(e => e.textContent = fmt(counts[e.dataset.count] || 0));
    $('#roB', root).classList.toggle('on', T > 0 && T % L().mile === 0);
    if (milestoneCheck && T > prev && Math.floor(T / L().mile) > Math.floor(prev / L().mile)) {
      const k = Math.floor(T / L().mile);
      const exact = T % L().mile === 0;
      setTimeout(() => {
        banner(stage, `${fmt(k * L().mile)} ${un(sm)} = ${fmt(k)} ${un(bg, k)}`, exact ? 'בדיוק!' : `עכשיו על המשקל ${qty(T, sm)}`);
        Snd.play('mile'); if (k === 1) confetti(60);
      }, 380);
      if (discover('mass', L().disc)) $('#disc', root).innerHTML = discStrip('mass', discLabels('mass'));
    }
  }
  function add(k, n = 1) {
    const it = L().items.find(i => i.k === k), prev = total();
    if (prev + it.v * n > L().max) { toast(`המשקל הזה שוקל עד ${qty(L().max, L().small)}`); Snd.play('no'); return; }
    counts[k] = (counts[k] || 0) + n; lastAdded = k; Snd.play('drop'); update(true, prev);
  }
  function remove(k) {
    if (!counts[k]) return;
    counts[k]--; lastAdded = null; Snd.play('lift'); update();
  }
  function setLevel(k) {
    lv = k; counts = {}; shown = 0; lastAdded = null;
    $$('#lvChips .chip', root).forEach(c => c.setAttribute('aria-pressed', String(c.dataset.lv === k)));
    $('#scaleName', svg).textContent = L().scale;
    $('#lvNote', root).textContent = L().note;
    $('#items', root).innerHTML = L().items.map(it => `
      <div class="item-btn">
        ${svgArt(it.k)}
        <div><b>${it.name}</b><span>${it.note}</span></div>
        <div class="pm">
          <button class="btn soft small" data-rm="${it.k}" aria-label="להוריד ${it.name}">${ui('minus')}</button>
          <span class="pill" style="min-width:3.2em;justify-content:center" data-count="${it.k}">0</span>
          ${it.steps.map(n => `<button class="btn c small" data-add="${it.k}" data-n="${n}" aria-label="להוסיף ${n} ${it.name}">${ui('plus')}${n > 1 ? fmt(n) : ''}</button>`).join('')}
        </div>
      </div>`).join('');
    update();
  }
  $('#lvChips', root).onclick = (e) => { const b = e.target.closest('[data-lv]'); if (b) { Snd.play('tap'); setLevel(b.dataset.lv); } };
  $('#items', root).onclick = (e) => {
    const a = e.target.closest('[data-add]'), r = e.target.closest('[data-rm]');
    if (a) add(a.dataset.add, +a.dataset.n); else if (r) remove(r.dataset.rm);
  };
  $('#pile', svg).addEventListener('click', (e) => { const g = e.target.closest('[data-k]'); if (g) remove(g.dataset.k); });
  $('#clear', root).onclick = () => { counts = {}; lastAdded = null; Snd.play('lift'); update(); };
  $('#disc', root).innerHTML = discStrip('mass', discLabels('mass'));
  setLevel('g');
  return () => cancelAnimationFrame(raf);
};

LEARN.vol = (root) => {

            <path fill="none" class="s-glass" stroke-width="7" stroke-linecap="round" d="M250 98Q292 100 290 148Q288 194 250 198"/>
            <path d="M108 60H136" class="s-glass" stroke-width="4" stroke-linecap="round"/>
            <path d="M232 74V250" stroke="#fff" stroke-opacity=".4" stroke-width="5" stroke-linecap="round"/>
            ${marks}
            <text x="185" y="52" text-anchor="middle" font-size="13" class="t-muted">קנקן: 1 ליטר</text>
          </g>
          <path id="stream" class="stream s-water" stroke-width="7" stroke-linecap="round" fill="none" d="" opacity="0"/>
          <g id="cup" style="cursor:pointer" role="button" aria-label="למזוג כוס">
            <defs><clipPath id="cupIn"><path d="M3 3H47L42 60Q41 64 37 64H13Q9 64 8 60Z"/></clipPath></defs>
            <g clip-path="url(#cupIn)"><rect id="cupWater" x="0" y="12" width="50" height="54" class="f-water"/></g>
            <path class="f-glass s-glass" stroke-width="3.5" stroke-linejoin="round" d="M2 2H48L43 60Q42 65 37 65H13Q8 65 7 60Z"/>
            <path d="M10 8L14 56" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
            <text x="25" y="44" text-anchor="middle" font-size="12" fill="#fff">250</text>
          </g>
          <text x="311" y="296" text-anchor="middle" font-size="12" class="t-muted">כוס 250 מ״ל</text>
        </svg>
      </div>
      <div class="readouts">
        <div class="ro" id="roMl"><small>במיליליטרים</small><b class="num"></b></div>
        <div class="ro" id="roL"><small>בליטרים</small><b class="num"></b></div>

    <div class="panel">
      <h3>בקבוקים וכוסות</h3>

      <div class="bottles" id="bottles">
        ${[[.5, 74], [1, 98], [2, 128]].map(([l, hgt]) => `<button class="bottle-btn" data-l="${l}" aria-pressed="false"><svg viewBox="0 0 100 100" style="height:${hgt}px" aria-hidden="true">${uniq(ART.bottle(`${fmt(l)} ל׳`, .8))}</svg><b>${fmt(l)} ליטר</b></button>`).join('')}

      <div id="bottleOut" class="bottle-out"><p class="note">בחרי בקבוק למעלה.</p></div>

  const svg = $('#volSvg', root), stage = $('#stage', root);
  const cupG = $('#cup', svg), stream = $('#stream', svg);
  const REST = { x: 286, y: 212, a: 0 }, POUR = { x: 236, y: 54, a: -112 };
  const setCup = (t) => {
    const x = REST.x + (POUR.x - REST.x) * t, y = REST.y + (POUR.y - REST.y) * t, a = REST.a + (POUR.a - REST.a) * t;
    cupG.setAttribute('transform', `translate(${x} ${y}) rotate(${a})`);
  };
  const setCupWater = (f) => { const h = 54 * f; const r = $('#cupWater', svg); r.setAttribute('y', 66 - h); r.setAttribute('height', h); };
  function drawWater() {
    const y = BOT - level * PX;
    $('#water', svg).setAttribute('y', y); $('#water', svg).setAttribute('height', level * PX + 2);
    $('#surfG', svg).setAttribute('transform', `translate(0 ${y})`);
    $('#surfG', svg).style.opacity = level > 0 ? 1 : 0;

    $('#roMl b', root).textContent = qty(Math.round(T), 'ml');

  }
  function info() {
    const T = full * CAP + level;
    $('#roCups', root).textContent = fmt(cups);

  async function pour() {
    if (busy) return;

    const from = level, sx = POUR.x - 2, top = POUR.y + 4;

    await tween(900, t => {
      level = from + 250 * t; drawWater(); setCupWater(1 - t);
      stream.setAttribute('d', `M${sx} ${top} Q${sx - 3} ${top + 20} ${sx - 4} ${BOT - level * PX + 2}`);
    }, t => t);
    stream.setAttribute('opacity', '0');
    level = from + 250; cups++; drawWater(); info();
    await tween(380, t => setCup(1 - t));
    setCupWater(1);
    const T = full * CAP + level;
    const say = { 250: ['רבע ליטר', 'quarter'], 500: ['חצי ליטר', 'half'], 750: ['שלושה רבעים של ליטר', null] }[level];
    if (level === CAP) {
      banner(stage, `${fmt(T)} מ״ל = ${fmt(T / 1000)} ליטר`, full ? `${fmt(full + 1)} קנקנים מלאים` : '4 כוסות × 250 מ״ל = 1,000 מ״ל'.replace('1,000', fmt(1000)));
      Snd.play('mile'); if (!full) confetti(60);
      if (discover('vol', 'l')) $('#disc', root).innerHTML = discStrip('vol', discLabels('vol'));
      await wait(1400);
      if (full + 1 < MAXJ) {
        const jg = $('#jugG', svg);
        await tween(280, t => { jg.style.opacity = String(1 - t); });
        full++; level = 0; drawWater(); info();
        await tween(280, t => { jg.style.opacity = String(t); });
      }
    } else if (say) {
      const lit = fmt(level / 1000);
      banner(stage, `${fmt(level)} מ״ל = ${lit} ליטר`, full ? `ובסך הכול ${fmt(T)} מ״ל = ${fmt(T / 1000)} ליטר` : say[0]);
      Snd.play('star');
      if (say[1] && discover('vol', say[1])) $('#disc', root).innerHTML = discStrip('vol', discLabels('vol'));
    }
    busy = false; $('#pourBtn', root).disabled = false;
  }
  cupG.addEventListener('click', pour);
  $('#pourBtn', root).onclick = pour;
  $('#emptyBtn', root).onclick = async () => {
    if (busy) return; busy = true; Snd.play('pour', .5);
    const from = level; await tween(500, t => { level = from * (1 - t); drawWater(); });
    level = 0; full = 0; cups = 0; drawWater(); info(); busy = false;

    for (let i = 0; i < n; i++) setTimeout(() => Snd.play('tick'), i * 90);
    if (seen[.5] && seen[1] && seen[2] && discover('vol', 'bottles')) { $('#disc', root).innerHTML = discStrip('vol', discLabels('vol')); toast('בדקת את כל הבקבוקים!'); }
  };
  $('#disc', root).innerHTML = discStrip('vol', discLabels('vol'));
  setCup(0); setCupWater(1); drawWater(); info();
  return () => {};
};

function convHint(v, from, to, extraSteps, text) {

/* ===== solutions ===== */
function convSol(v, from, to) {
  const big = U[from].f >= U[to].f ? from : to, small = big === from ? to : from, r = U[big].f / U[small].f, a = conv(v, from, to);
  return from === big
    ? [`מיחידה גדולה ליחידה קטנה כופלים ב-${fmt(r)}:`, `${M(`${fmt(v)} × ${fmt(r)} = ${fmt(a)}`)}`, `${qty(v, from)} = ${qty(a, to)}`]
    : [`מיחידה קטנה ליחידה גדולה מחלקים ב-${fmt(r)}:`, `${M(`${fmt(v)} : ${fmt(r)} = ${fmt(a)}`)}`, `${qty(v, from)} = ${qty(a, to)}`];
}
const cmpAnswer = (q) => { const a = q.l[0] * U[q.l[1]].f, b = q.r[0] * U[q.r[1]].f; return Math.abs(a - b) < 1e-9 ? '=' : a > b ? '>' : '<'; };
function solution(q) {
  if (q.sol) return q.sol();
  if (q.type === 'num' && q.from) return convSol(q.v, q.from, q.to);
  if (q.type === 'mc' && q.h.k === 'conv') return convSol(q.h.v, q.h.from, q.h.to);
  if (q.type === 'cmp') {
    const s = U[q.l[1]].f <= U[q.r[1]].f ? q.l[1] : q.r[1];
    const a = conv(q.l[0], q.l[1], s), b = conv(q.r[0], q.r[1], s), sign = cmpAnswer(q);
    return [`נמיר הכול ל${un(s)}: ${qty(q.l[0], q.l[1])} = ${qty(a, s)}, ${qty(q.r[0], q.r[1])} = ${qty(b, s)}.`, M(`${qty(q.l[0], q.l[1])} ${sign} ${qty(q.r[0], q.r[1])}`)];
  }
  if (q.type === 'build') {
    let rest = q.target; const parts = [];
    [...q.tokens].sort((a, b) => TOK[b].v - TOK[a].v).forEach(k => { const n = Math.floor(rest / TOK[k].v + 1e-9); if (n) { parts.push(`${fmt(n)} × ${TOK[k].lab()}`); rest -= n * TOK[k].v; } });
    return [`${qty(q.tv, q.big)} = ${qty(q.target, q.small)}`, `לדוגמה: ${parts.join(' + ')}`];
  }
  return [];
}

/* ===== quiz engine ===== */
function seededOrder(id, n) {
  let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) >>> 0;

  for (let i = n - 1; i > 0; i--) { h = (h * 1103515245 + 12345) >>> 0; const j = h % (i + 1); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  return idx;
}
const unitText = (u, v = 2) => U[u] ? un(u, v) : u;

function runQuiz(body, st, mode, qi) {

  let hintCleanup = null, sess = {};
  const cleanHint = () => { if (hintCleanup) { try { hintCleanup(); } catch (e) {} hintCleanup = null; } };

  function nav() {
    return `<div class="qnav" role="tablist" aria-label="שאלות">${list.map((q, i) => {
      const s = S.stars[q.id] || 0;
      return `<button class="qdot${S.done[q.id] ? ' done' : ''}${i === idx && !showComplete ? ' cur' : ''}" data-i="${i}" aria-label="שאלה ${i + 1}${S.done[q.id] ? ', נפתרה' : ''}">${i + 1}
        ${S.done[q.id] ? `<span class="mini">${[0, 1, 2].map(k => starSvg(k < s)).join('')}</span>` : ''}</button>`;
    }).join('')}</div>`;
  }
  function complete() {
    const s = stationStats(st), stars = list.reduce((a, q) => a + (S.stars[q.id] || 0), 0);
    const nextSt = ORDER[(ORDER.indexOf(st) + 1) % ORDER.length];
    body.innerHTML = `${nav()}<div class="panel complete">
      <svg class="medal" viewBox="0 0 100 100" aria-hidden="true">${mode === 'practice' ? ART.medal() : ART.trophy()}</svg>
      <h3>כל הכבוד, יוליה!</h3>
      <p>סיימת את כל ${mode === 'practice' ? 'התרגילים' : 'האתגרים'} בתחנת ${STATIONS[st].name} וצברת ${fmt(stars)} מתוך ${fmt(list.length * 3)} כוכבים.</p>
      <p class="note">אפשר לחזור לשאלות ולנסות לשפר את הכוכבים.</p>
      <div class="row" style="justify-content:center">
        ${mode === 'practice' ? `<button class="btn c" id="toCh">${ui('challenge')}לאתגר</button>` : ''}
        <button class="btn ghost" id="toNext">לתחנה הבאה: ${STATIONS[nextSt].name}</button>
      </div></div>`;
    bindNav();
    const tc = $('#toCh', body); if (tc) tc.onclick = () => go({ name: 'station', st, mode: 'challenge' });
    $('#toNext', body).onclick = () => go({ name: 'station', st: nextSt, mode: 'learn' });
  }
  function bindNav() {
    $$('.qdot', body).forEach(b => b.onclick = () => { Snd.play('tap'); showComplete = false; idx = +b.dataset.i; show(); });
  }
  function show() {
    cleanHint();
    if (showComplete) return complete();
    const q = list[idx]; sess[q.id] = sess[q.id] || { tries: 0, hint: false, sol: false, solved: false };
    const ss = sess[q.id];
    S.last = { name: 'station', st, mode, qi: idx }; save();
    let ans = '';
    if (q.type === 'num') ans = `<div class="answer-num"><input id="inp" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" aria-label="התשובה" placeholder="?"><span class="unit">${unitText(q.u)}</span></div>`;
    if (q.type === 'mc') { const o = q.opts(); ans = `<div class="opts">${seededOrder(q.id, o.length).map(i => `<button class="opt" data-o="${i}">${o[i]}</button>`).join('')}</div>`; }
    if (q.type === 'cmp') ans = `<div class="cmp"><div class="qty">${qty(q.l[0], q.l[1])}</div><div class="sym" id="sym">?</div><div class="qty">${qty(q.r[0], q.r[1])}</div></div>
      <div class="cmp-btns">${['&gt;', '&lt;', '='].map((s, i) => `<button class="opt" data-c="${['>', '<', '='][i]}" aria-label="${['גדול מ', 'קטן מ', 'שווה ל'][i]}">${s}</button>`).join('')}</div>`;
    if (q.type === 'build') ans = `<div class="build">
      <div class="palette" id="pal">${q.tokens.map(k => `<button class="tok" data-k="${k}" aria-label="הוספת ${TOK[k].lab()}"><svg viewBox="0 0 100 100" aria-hidden="true">${uniq(TOK[k].art())}</svg><span>${TOK[k].lab()}</span></button>`).join('')}</div>
      <div class="tray" id="tray" aria-label="${q.place}"><span class="empty">גררי לכאן (או הקישי על פריט)</span></div>
      <div class="row" style="justify-content:space-between"><span class="total-line" id="tot"></span><button class="btn ghost small" id="trayClear">${ui('reset')}ניקוי</button></div></div>`;
    body.innerHTML = `${nav()}
      <div class="panel qcard">
        <div class="qtop"><span>${mode === 'practice' ? 'תרגיל' : 'אתגר'} ${idx + 1} מתוך ${list.length}</span><span class="qtag">${q.tag}</span></div>
        <p class="qtext">${q.q()}</p>
        ${ans}
        <div class="qactions">
          ${q.type === 'num' || q.type === 'build' ? `<button class="btn c grow" id="check">${ui('check')}בדיקה</button>` : ''}
          <button class="btn hint" id="hintBtn" aria-expanded="false">${ui('bulb')}רמז</button>
          <button class="btn ghost small" id="solBtn" hidden>${ui('eye')}הצגת הפתרון</button>
        </div>
        <div id="hint"></div>
        <div id="fb" aria-live="polite"></div>
      </div>`;
    bindNav();
    $('#hintBtn', body).onclick = () => {
      const box = $('#hint', body), btn = $('#hintBtn', body);
      if (box.innerHTML) { cleanHint(); box.innerHTML = ''; btn.setAttribute('aria-expanded', 'false'); return; }
      ss.hint = true; Snd.play('star'); btn.setAttribute('aria-expanded', 'true');
      hintCleanup = renderHint(q, box);
      box.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'nearest' });
    };
    $('#solBtn', body).onclick = () => { ss.sol = true; feedback('info', 'הפתרון', solution(q)); $('#solBtn', body).hidden = true; };
    if (q.type === 'num') {
      const inp = $('#inp', body);
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
      $('#check', body).onclick = check;
    }
    if (q.type === 'mc') $$('.opt', body).forEach(b => b.onclick = () => { if (ss.solved) return; const ok = b.dataset.o === '0'; b.classList.add(ok ? 'right' : 'wrong'); result(ok, null, b); });
    if (q.type === 'cmp') $$('.cmp-btns .opt', body).forEach(b => b.onclick = () => {
      if (ss.solved) return; const ok = b.dataset.c === cmpAnswer(q);
      $('#sym', body).textContent = b.dataset.c; b.classList.add(ok ? 'right' : 'wrong'); result(ok);
    });
    if (q.type === 'build') { setupBuild(q); $('#check', body).onclick = check; }
    if (ss.solved) feedback('ok', 'נפתר', solution(q), S.stars[q.id] || 0, true);

    function check() {
      if (ss.solved) return;
      if (q.type === 'num') {
        const val = parseNum($('#inp', body).value);
        if (isNaN(val)) { toast('כתבי מספר בתיבה'); return; }
        const ok = same(val, q.a);
        let tip = null;
        if (!ok) {
          if (q.from) {
            const r = U[q.from].f / U[q.to].f;
            if (r > 1 && same(val, q.v / r)) tip = 'נראה שחילקת. מיחידה גדולה ליחידה קטנה <b>כופלים</b>.';
            else if (r < 1 && same(val, q.v / r)) tip = 'נראה שכפלת. מיחידה קטנה ליחידה גדולה <b>מחלקים</b>.';
          }
          if (!tip) {
            const ratio = val / q.a;
            if ([10, 100, 1000, .1, .01, .001].some(x => same(ratio, x))) tip = 'הספרות נכונות, אבל הגודל לא. בדקי כמה אפסים צריך או איפה הנקודה העשרונית.';
            else tip = val < q.a ? 'המספר שלך קטן מדי.' : 'המספר שלך גדול מדי.';
          }
        }
        result(ok, tip);
      } else if (q.type === 'build') {
        const tot = buildTotal();
        if (!tot) { toast('עוד לא גררת פריטים'); return; }
        const ok = tot === q.target;
        result(ok, ok ? null : tot < q.target ? `חסרים עוד ${qty(q.target - tot, q.small)}.` : `יש ${qty(tot - q.target, q.small)} יותר מדי. הוציאי פריט בלחיצה עליו.`);
      }
    }
    function result(ok, tip) {
      if (ok) {
        ss.solved = true;
        const stars = ss.sol ? 1 : ss.tries === 0 && !ss.hint ? 3 : ss.tries <= 1 ? 2 : 1;
        const before = allDone();
        S.stars[q.id] = Math.max(S.stars[q.id] || 0, stars); S.done[q.id] = true; save(); refreshTop();
        Snd.play('ok'); for (let i = 0; i < stars; i++) setTimeout(() => Snd.play('star'), 450 + i * 160);
        confetti(stars === 3 ? 100 : 50);
        feedback('ok', ['', 'נכון!', 'יופי, נכון!', 'מצוין! תשובה נכונה'][stars], solution(q), stars);
        $('.qnav', body).outerHTML = nav();
        bindNav();
        if (!before && allDone()) setTimeout(() => toast(mode === 'practice' ? 'קיבלת מדליה! סיימת את כל התרגילים.' : 'קיבלת גביע! סיימת את כל האתגרים.'), 900);
      } else {
        ss.tries++; Snd.play('no');
        feedback('no', 'עוד לא. נסי שוב', [tip || (q.type === 'cmp' ? 'המירי את שתי הכמויות לאותה יחידה ואז השווי.' : 'אפשר להיעזר ברמז.')]);
        if (ss.tries >= 2) $('#solBtn', body).hidden = false;
      }
    }
  }
  function feedback(kind, title, lines, stars = 0, quiet = false) {
    const fb = $('#fb', body);
    const st3 = kind === 'ok' ? `<span class="earned">${[0, 1, 2].map(i => `<span class="${quiet ? '' : 'pop'}" style="animation-delay:${i * 160}ms;display:inline-block">${starSvg(i < stars)}</span>`).join('')}</span>` : '';
    fb.innerHTML = `<div class="feedback ${kind}">
      <h4>${kind === 'ok' ? ui('check') : kind === 'no' ? ui('x') : ui('eye')}${title} ${st3}</h4>
      ${lines.map(l => `<p>${l}</p>`).join('')}
      ${kind === 'ok' ? `<div class="row"><button class="btn c" id="nextQ">${allDone() ? 'סיום' : 'לשאלה הבאה'}${ui('next')}</button></div>` : ''}
    </div>`;
    const n = $('#nextQ', fb);
    if (n) n.onclick = () => {
      Snd.play('tap');
      if (allDone()) { showComplete = true; show(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
      let j = list.findIndex((q, i) => i > idx && !S.done[q.id]);
      if (j < 0) j = list.findIndex(q => !S.done[q.id]);
      if (j < 0) j = (idx + 1) % list.length;
      idx = j; show(); window.scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' });
    };
    if (!quiet) fb.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'nearest' });
  }

  /* drag-and-drop build questions */
  let trayItems = [];
  const buildTotal = () => trayItems.reduce((a, k) => a + TOK[k].v, 0);
  function setupBuild(q) {
    trayItems = [];
    const tray = $('#tray', body), pal = $('#pal', body);
    function drawTray() {
      tray.innerHTML = trayItems.length ? trayItems.map((k, i) => `<button class="tk" data-i="${i}" aria-label="הוצאת ${TOK[k].lab()}"><svg viewBox="0 0 100 100" aria-hidden="true">${uniq(TOK[k].art())}</svg></button>`).join('')
        : `<span class="empty">גררי לכאן (או הקישי על פריט)</span>`;
      const t = buildTotal();
      $('#tot', body).innerHTML = `סה״כ: ${qty(t, q.small)}${t ? ` = ${qty(conv(t, q.small, q.big), q.big)}` : ''}`;
    }
    tray.onclick = e => { const b = e.target.closest('.tk'); if (b && !sess[q.id].solved) { trayItems.splice(+b.dataset.i, 1); Snd.play('lift'); drawTray(); } };
    $('#trayClear', body).onclick = () => { if (!sess[q.id].solved) { trayItems = []; drawTray(); } };
    const addTok = (k) => {
      if (sess[q.id].solved) return;
      if (trayItems.length >= 30) { toast('יש כבר הרבה פריטים. נסי פריטים גדולים יותר.'); return; }
      trayItems.push(k); Snd.play('drop'); drawTray();
    };
    $$('.tok', pal).forEach(btn => {
      let start = null, ghost = null, moved = false;
      btn.addEventListener('pointerdown', e => { start = { x: e.clientX, y: e.clientY }; moved = false; btn.setPointerCapture(e.pointerId); });
      btn.addEventListener('pointermove', e => {
        if (!start) return;
        if (!moved && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 8) {
          moved = true; ghost = h2el(`<svg class="ghost-drag" viewBox="0 0 100 100">${uniq(TOK[btn.dataset.k].art())}</svg>`); document.body.appendChild(ghost);
        }
        if (ghost) {
          ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px';
          const r = tray.getBoundingClientRect(); tray.classList.toggle('over', e.clientX > r.left && e.clientX < r.right && e.clientY > r.top && e.clientY < r.bottom);
        }
      });
      const end = (e, cancel) => {
        if (!start) return;
        const r = tray.getBoundingClientRect(), over = e.clientX > r.left && e.clientX < r.right && e.clientY > r.top && e.clientY < r.bottom;
        if (!cancel && (!moved || over)) addTok(btn.dataset.k);
        if (ghost) ghost.remove(); ghost = null; start = null; tray.classList.remove('over');
      };
      btn.addEventListener('pointerup', e => end(e, false));
      btn.addEventListener('pointercancel', e => end(e, true));
      btn.addEventListener('click', e => { if (e.detail === 0) addTok(btn.dataset.k); });
    });
    drawTray();
  }

  show();
  return () => { cleanHint(); $$('.ghost-drag').forEach(g => g.remove()); };
}

/* ===== boot ===== */
document.documentElement.setAttribute('lang', 'he');
document.documentElement.setAttribute('dir', 'rtl');
shell();
render();

</script>
</body>
</html>
